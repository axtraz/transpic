name: Publish

on:
  push:
    tags:
      - "v[0-9]*"
      - "*-v[0-9]*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build --target x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:22-alpine
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:22-debian-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build --target aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:22-alpine

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.docker }}
        with:
          targets: ${{ matrix.target }}

      - name: Install deps
        working-directory: core
        run: pnpm install --no-frozen-lockfile

      - name: Build (native)
        if: ${{ !matrix.docker }}
        working-directory: core
        run: ${{ matrix.build }}

      - name: Build (docker)
        if: ${{ matrix.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.docker }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace/core -e COREPACK_ENABLE_DOWNLOADS=0 -e COREPACK_INTEGRITY_KEYS=0
          run: |
            npm install -g pnpm --force
            pnpm install --no-frozen-lockfile
            ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: core/transpic-core.*.node
          if-no-files-found: error

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: transpic-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: transpic-cli.exe

    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust binary
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Move binary to expected folder
        working-directory: cli
        shell: bash
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} target/release/

      - name: Copy binary
        working-directory: cli
        run: node scripts/copy-binary.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: cli/bin/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, build-cli]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install deps
        working-directory: core
        run: pnpm install --no-frozen-lockfile

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          path: core/artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Move artifacts
        working-directory: core
        run: pnpm artifacts

      - name: List npm packages
        working-directory: core
        run: ls -la npm/

      - name: Publish platform packages
        working-directory: core
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            cd "$dir"
            npm publish --access public
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        working-directory: core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/bin
          pattern: cli-*
          merge-multiple: true

      - name: Set permissions
        run: chmod +x cli/bin/transpic-cli || true

      - name: Publish CLI
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}