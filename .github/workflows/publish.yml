name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'core-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc

          - os: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build --target x86_64-unknown-linux-musl
            cross: true

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools musl-dev

      - name: Install deps
        working-directory: core
        run: pnpm install --no-frozen-lockfile

      - name: Create bin directory
        working-directory: core
        run: mkdir -p bin

      - name: Build
        working-directory: core
        run: ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: core/transpic-core.*.node
          if-no-files-found: error

  build-cli:
    if: startsWith(github.event.release.tag_name, 'cli-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: transpic-cli-linux

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: transpic-cli.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: transpic-cli-darwin

    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust binary
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Move binary to expected folder
        working-directory: cli
        shell: bash
        run: |
          mkdir -p target/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/transpic-cli.exe target/release/
          else
            cp target/${{ matrix.target }}/release/transpic-cli target/release/
          fi

      - name: Copy binary
        working-directory: cli
        run: node scripts/copy-binary.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: cli/bin/${{ matrix.binary }}
          if-no-files-found: error

  publish-apps:
    if: "!startsWith(github.event.release.tag_name, 'core-v') && !startsWith(github.event.release.tag_name, 'cli-v')"
    name: Build & release Tauri app (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: apps
        run: pnpm install --no-frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps
          tagName: ${{ github.event.release.tag_name }}
          releaseName: "transpic ${{ github.event.release.tag_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-core:
    name: Publish core to npm
    if: startsWith(github.event.release.tag_name, 'core-v')
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install deps
        working-directory: core
        run: pnpm install --no-frozen-lockfile

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          path: core/artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Move artifacts
        working-directory: core
        run: pnpm artifacts

      - name: List npm packages
        working-directory: core
        run: ls -la npm/

      - name: Publish platform packages
        working-directory: core
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            (cd "$dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish core package
        working-directory: core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    name: Publish CLI to npm
    if: startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    needs: [build-cli]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/bin
          pattern: cli-*
          merge-multiple: true

      - name: Set permissions
        run: |
          chmod +x cli/bin/transpic-cli-linux || true
          chmod +x cli/bin/transpic-cli-darwin || true

      - name: Publish CLI
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
