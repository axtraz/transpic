[package]
name = "Transpic"
version = "0.3.0"
description = "App for transpic !"
authors = ["Axtraz"]
edition = "2021"

[lib]
name = "transpic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
transpic_core = { path = "../../core" }
image = { version = "0.25.10", features = ["avif", "exr", "webp"] }
base64 = "0.22.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
