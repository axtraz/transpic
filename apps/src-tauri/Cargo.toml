[package]
name = "Transpic"
version = "0.1.1"
description = "App for transpic !"
authors = ["Axtraz"]
edition = "2021"

[lib]
name = "transpic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transpic_core = { path = "../../core" }
image = { version = "0.25", features = ["avif", "exr", "webp"] }
base64 = "0.22"
